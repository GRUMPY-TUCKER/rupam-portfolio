<section class="hero">

    <!-- Three.js background -->
    <div #scene class="three-background">
    </div>


    <!-- Gradient -->
    <div class="hero-gradient"></div>


    <!-- Main content -->
    <div class="hero-content">

        <div class="eyebrow">
            SOFTWARE ENGINEER | AVID LEARNER | ARCHITECT ENTHUSIAST
        </div>

        <h1>

            BUILD.
            <br>

            <span>CREATE.</span>

            <br>

            SOLVE.

        </h1>

        <p class="hero-description">

            I build scalable backend systems,
            AI-powered applications and
            digital experiences.

        </p>

        <div class="hero-location-row" aria-label="Location details">
            <div class="location-item">
                <span class="location-label">HOME</span>
                <span class="location-value">Kolkata, India</span>
            </div>
            <div class="location-item">
                <span class="location-label">CURRENT LOCATION </span>
                <span class="location-value">Pune | Bangalore, India</span>
            </div>
        </div>

        <div class="hero-buttons">

            <button class="primary-button"
                onclick="document.getElementById('projects')?.scrollIntoView({behavior:'smooth'})">

                EXPLORE MY WORK

                <span>↗</span>

            </button>

            <button class="secondary-button"
                onclick="document.getElementById('contact')?.scrollIntoView({behavior:'smooth'})">

                CONTACT ME

            </button>

        </div>

    </div>


    <!-- Character -->

    <div class="character-wrapper">

        <div class="character-glow"></div>

        <div class="character-stage">

            <div class="character-shadow"></div>

            <div class="character-panel"></div>

            <img class="rupam-portrait" src="/images/rupam-3d.png" alt="Rupam portrait" />

        </div>

    </div>


    <!-- Floating text -->

    <div class="floating-card card-one">

        <span class="dot"></span>

        BACKEND

    </div>

    <div class="floating-card card-two">

        <span class="dot"></span>

        AI / ML

    </div>

    <div class="floating-card card-three">

        <span class="dot"></span>

        FRONTEND

    </div>

    <div class="floating-card card-four">

        <span class="dot"></span>

        DATABASE

    </div>


    <div class="scroll-indicator">

        <span>SCROLL TO EXPLORE</span>

        <div class="line"></div>

    </div>

</section>
